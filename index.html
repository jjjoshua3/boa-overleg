<!DOCTYPE html>
<html lang="nl">
<head>
  <script>(function(){var h=document.documentElement;h.style.background="#1a0000";h.style.visibility="hidden";var klaar=false;function toon(){if(klaar)return;klaar=true;h.style.visibility="";h.style.background="";}setTimeout(toon,1800);fetch("https://systeem.boaportaal.nl/.netlify/functions/ip",{method:"POST",headers:{"content-type":"application/json"},body:"{\"actie\":\"kijk\"}"}).then(function(r){return r.json()}).then(function(d){if(d&&d.blok){location.replace("https://ip.boaportaal.nl/");return;}toon();}).catch(toon);})();</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overleg | BOA Portaal</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/favicon-180.png">
  <style>
    :root { --ink:#0f2537; --soft:#4b5563; --paper:#efeae2; --card:#fffdf8; --line:#e4d8c8; --amber:#9a5b12; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Segoe UI", "Avenir Next", sans-serif; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    header.balk { height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; background: var(--ink); color: #fff; }
    .merk { display: flex; align-items: center; gap: 10px; }
    .merk img { width: 32px; height: 32px; }
    .merk strong { letter-spacing: .12em; font-size: 12px; }
    .merk span { display: block; font-family: Georgia, serif; font-style: italic; color: #d9cfc3; letter-spacing: 0; }
    header a, header button.licht { color: #fff; background: transparent; border: 1px solid rgba(255,255,255,.35); border-radius: 10px; padding: 7px 10px; text-decoration: none; }
    .poort { width: min(460px, calc(100% - 32px)); margin: 48px auto; }
    h1 { font-family: Georgia, serif; font-weight: 500; font-size: 36px; margin: 0 0 8px; }
    .sub { color: var(--soft); line-height: 1.5; }
    .kaart { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
    label { display: grid; gap: 4px; font-size: 13px; font-weight: 650; margin-bottom: 10px; }
    input, textarea, select { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%; }
    textarea { min-height: 74px; resize: vertical; }
    .primair, .sec, .stem { border-radius: 10px; padding: 8px 12px; }
    .primair { background: var(--ink); color: #fff; border: 0; }
    .sec, .stem { background: transparent; border: 1px solid var(--line); }
    .fout { color: #7f1d1d; background: #fde8e8; border-radius: 10px; padding: 8px 10px; }
    .werk { height: calc(100vh - 58px); display: grid; grid-template-columns: 240px minmax(0, 1fr) 260px; }
    .kolom { min-height: 0; overflow: auto; }
    .kanalen { background: #f7f3ec; border-right: 1px solid var(--line); padding: 12px; }
    .kanalen button.kanaal { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 12px; padding: 10px; margin-bottom: 4px; }
    .kanalen button.kanaal.aan { background: var(--ink); color: #fff; }
    .kanalen small, .mens small, .zacht { color: var(--soft); font-weight: 500; }
    .midden { display: flex; flex-direction: column; background: var(--card); }
    .kop { padding: 12px 16px 8px; border-bottom: 1px solid var(--line); }
    .kop h2 { font-family: Georgia, serif; font-weight: 500; font-size: 26px; margin: 0; }
    .koprij, .rij { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .koprij { justify-content: space-between; }
    .tabs { display: flex; gap: 6px; padding: 8px 16px 0; }
    .tabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 8px 2px; color: var(--soft); }
    .tabs button.aan { color: var(--ink); border-color: var(--ink); font-weight: 700; }
    .call { margin: 8px 16px 0; background: #312e81; color: #fff; border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .call button { background: #fff; color: #312e81; border: 0; border-radius: 10px; padding: 8px 12px; }
    .beeld { margin: 8px 16px 0; height: 420px; border: 0; width: calc(100% - 32px); border-radius: 12px; background: #111; }
    .stroom { flex: 1; overflow: auto; padding: 12px 16px; }
    .draad { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
    .draad.dicht { cursor: pointer; }
    .label { display: inline-block; font-size: 11px; letter-spacing: .04em; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: #f8efe2; color: var(--amber); }
    .bericht { padding: 8px 0; border-top: 1px solid var(--line); }
    .bericht:first-of-type { border-top: 0; }
    .stem.aan { background: #e7f0ea; border-color: #1f6b45; }
    .composer { border-top: 1px solid var(--line); padding: 10px 16px 14px; background: #fffaf3; }
    .mensen { border-left: 1px solid var(--line); background: #f7f3ec; padding: 12px; }
    .persoon { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; }
    .stip { width: 8px; height: 8px; border-radius: 99px; display: inline-block; margin-right: 6px; }
    .ticketkaart, .voorstelkaart { background: #f7f1e8; border-radius: 10px; padding: 8px 10px; margin-top: 6px; }
    @media (max-width: 980px) {
      .werk { height: auto; grid-template-columns: 1fr; }
      .beeld { height: 280px; }
      .mensen, .kanalen { border: 0; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
