<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vergadering | BOA Portaal</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
  <style>
    @font-face { font-family: "Plus Jakarta Sans"; src: url("/fonts/plus-jakarta-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Plus Jakarta Sans"; src: url("/fonts/plus-jakarta-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
    :root { --paper:#0b1320; --panel:#131f31; --ink:#e7eef5; --muted:#a9b8c6; --line:#26354d; --accent:#1d4ed8; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif; }
    body { display: grid; place-items: center; }
    .kaart { width: min(460px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding: 20px; }
    h1 { font-size: 28px; letter-spacing: -0.03em; margin: 0 0 8px; }
    p { color: var(--muted); line-height: 1.5; }
    label { display: grid; gap: 4px; font-weight: 650; margin-top: 12px; }
    input { background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 2px; min-height: 44px; padding: 8px 10px; font: inherit; }
    .gastbeeld { position: fixed; inset: 0; display: flex; flex-direction: column; background: #000; }
    .gastbeeld .videos { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 8px; padding: 8px; }
    .gastbeeld video { width: 100%; height: 100%; min-height: 220px; object-fit: cover; background: #111; }
    .gastbeeld video.zelf { transform: scaleX(-1); }
    .deelkader { position: relative; min-height: 220px; background: #111; }
    .gastbeeld .deelkader video { width: 100%; height: 100%; min-height: 220px; object-fit: contain; background: #111; transform: none; }
    .deelkader span { position: absolute; left: 8px; top: 8px; background: #1d4ed8; color: #fff; font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 2px; }
    .gastbeeld button.aan { background: #0f172a; }
    .gastbeeld .hostbalk { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px; background: #131f31; }
    .gastbeeld button { background: #1d4ed8; color: #fff; border: 0; border-radius: 2px; min-height: 40px; padding: 8px 12px; font: inherit; font-weight: 650; }
  </style>
</head>
<body>
  <main class="kaart" id="wacht">
    <p style="letter-spacing:.08em;font-size:12px;font-weight:700;color:#fbbf24;margin:0 0 6px">BOA PORTAAL</p>
    <h1>De host is er nog niet.</h1>
    <p>Je hoeft nergens in te loggen. Zodra de vergadering open is, kom je vanzelf binnen. Zet hieronder hoe je genoemd wilt worden.</p>
    <label>Je naam<input id="naam" maxlength="60" placeholder="Voornaam"></label>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const room = params.get("room") || "";
    const direct = params.get("direct") === "1";
    const vak = document.getElementById("wacht");
    const naamveld = document.getElementById("naam");
    function start() {
      const naam = naamveld.value.trim() || "Gast";
      localStorage.setItem("overleg-gastnaam", naam);
      document.body.innerHTML = '<div id="gesprek" class="gastbeeld"></div>';
      document.body.style.display = "block";
      return import("/gesprek.js").then(({ startGesprek }) => startGesprek(document.getElementById("gesprek"), { room, naam, video: true }));
    }
    if (!/^boa[a-z0-9]{10,48}$/.test(room)) {
      vak.innerHTML = "<h1>Deze link klopt niet.</h1><p>Vraag een nieuwe link aan de host.</p>";
    } else if (direct) {
      vak.querySelector("h1").textContent = "Deelnemen aan de call";
      const uitleg = vak.querySelectorAll("p")[1];
      if (uitleg) uitleg.textContent = "Je hoeft nergens in te loggen. Vul je naam in en je zit in de vergadering.";
      const knop = document.createElement("button");
      knop.type = "button";
      knop.textContent = "Nu deelnemen";
      knop.style.cssText = "margin-top:16px;background:#1d4ed8;color:#fff;border:0;min-height:44px;padding:8px 14px;font:inherit;font-weight:700";
      knop.onclick = start;
      vak.appendChild(knop);
      naamveld.value = localStorage.getItem("overleg-gastnaam") || "";
    } else {
      naamveld.value = localStorage.getItem("overleg-gastnaam") || "";
      naamveld.addEventListener("change", () => localStorage.setItem("overleg-gastnaam", naamveld.value.trim()));
      const timer = setInterval(async () => {
        try {
          const res = await fetch("https://systeem.boaportaal.nl/.netlify/functions/wacht", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ room }),
          });
          const data = await res.json();
          if (!data.open) return;
          clearInterval(timer);
          const naam = naamveld.value.trim() || "Gast";
          document.body.innerHTML = '<div id="gesprek" class="gastbeeld"></div>';
          document.body.style.display = "block";
          const { startGesprek } = await import("/gesprek.js");
          startGesprek(document.getElementById("gesprek"), { room, naam, video: true });
        } catch {}
      }, 3000);
    }
  </script>
</body>
</html>
